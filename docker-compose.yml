services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: connecthub
      POSTGRES_PASSWORD: connecthub
      POSTGRES_DB: connecthub
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connecthub"]
      interval: 5s
      retries: 10

volumes:
  dbdata:
